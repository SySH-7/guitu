name: H5 checks

on:
  push:
    branches: [tieba-h5]
  pull_request:
    branches: [tieba-h5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 build.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
